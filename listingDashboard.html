<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Available House Sitting Listings | SecureNest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      margin: 0;
      color: #333;
    }

    header {
      background: #0a2540;
      color: white;
      padding: 25px;
      text-align: center;
    }

    section {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .listing {
      background: white;
      border-radius: 8px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .listing img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
    }

    .listing-content {
      padding: 20px;
    }

    .listing h3 {
      margin-top: 0;
      color: #0a2540;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 15px;
      font-size: 14px;
    }

    .details div {
      background: #f1f5f9;
      padding: 10px;
      border-radius: 4px;
    }

    .price {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #1d4ed8;
    }

    .btn {
      margin-top: 15px;
      background: #1d4ed8;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn.secondary {
      background: #0a2540;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      margin: 40px 0;
      gap: 10px;
    }

    .pagination button {
      padding: 8px 14px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      border-radius: 4px;
    }

    .pagination button.active {
      background: #1d4ed8;
      color: white;
      border-color: #1d4ed8;
    }

    footer {
      background: #0a2540;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>Available House Sitting Listings</h1>
  <p>Browse verified homes looking for trusted sitters</p>
</header>

<section id="listings"></section>

<div class="pagination" id="pagination"></div>

<footer>
  © 2025 SecureNest House Sitting | South Africa
</footer>

<script>
  const listingsPerPage = 3;
  let currentPage = 1;

  const listingsData = [
    {
      address: "Sandton, Johannesburg, Gauteng",
      pets: "2 Dogs",
      days: 7,
      contact: "071 234 5678",
      price: "R4,500",
      notes: "Friendly dogs. Feeding twice daily.",
      image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c"
    },
    {
      address: "Durban North, KwaZulu-Natal",
      pets: "1 Cat",
      days: 10,
      contact: "073 555 8899",
      price: "R6,000",
      notes: "Indoor cat, very calm.",
      image: "https://images.unsplash.com/photo-1568605114967-8130f3a36994"
    },
    {
      address: "Stellenbosch, Western Cape",
      pets: "No Pets",
      days: 5,
      contact: "082 111 2222",
      price: "R2,500",
      notes: "Quiet home, plant watering only.",
      image: "https://images.unsplash.com/photo-1605276374104-dee2a0ed3cd6"
    },
    {
      address: "Polokwane, Limpopo",
      pets: "3 Dogs",
      days: 14,
      contact: "079 888 9999",
      price: "R8,000",
      notes: "Large property, security aware.",
      image: "https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde"
    }
  ];

  function displayListings() {
    const container = document.getElementById("listings");
    container.innerHTML = "";

    const start = (currentPage - 1) * listingsPerPage;
    const end = start + listingsPerPage;
    const pageListings = listingsData.slice(start, end);

    pageListings.forEach(listing => {
      container.innerHTML += `
        <div class="listing">
          <img src="${listing.image}" alt="Home image">
          <div class="listing-content">
            <h3>${listing.address}</h3>

            <div class="details">
              <div><strong>Pets:</strong> ${listing.pets}</div>
              <div><strong>Days Needed:</strong> ${listing.days}</div>
              <div><strong>Contact:</strong> ${listing.contact}</div>
              <div><strong>Notes:</strong> ${listing.notes}</div>
            </div>

            <div class="price">${listing.price}</div>

            <button class="btn">Apply for This Listing</button>
          </div>
        </div>
      `;
    });
  }

  function setupPagination() {
    const pageCount = Math.ceil(listingsData.length / listingsPerPage);
    const pagination = document.getElementById("pagination");
    pagination.innerHTML = "";

    for (let i = 1; i <= pageCount; i++) {
      pagination.innerHTML += `
        <button class="${i === currentPage ? 'active' : ''}"
          onclick="changePage(${i})">${i}</button>
      `;
    }
  }

  function changePage(page) {
    currentPage = page;
    displayListings();
    setupPagination();
  }

  displayListings();
  setupPagination();
</script>

</body>
</html>
